# frontend это отдельный пакет со своим package.json. Описан как workspace,
# поэтому один `pnpm install` в корне ставит зависимости обоим, и отдельный
# postinstall с ручным `cd frontend` больше не нужен.
packages:
  - frontend

# pnpm с 10-й версии не запускает build-скрипты зависимостей без явного
# разрешения. Этим он нужен: они собирают нативный модуль, и без сборки
# ломается не установка, а запуск.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
