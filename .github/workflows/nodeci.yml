name: Node CI

# На каждое событие ровно один workflow: здесь нет release-please, поэтому
# main проверяет Node CI.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: make install
      # Сборка фронтенда проверяется в CI: поломанный импорт или отсутствующая
      # зависимость иначе доедут до студента.
      - name: Build frontend
        run: make build
      - name: Run tests
        run: make test
      - name: Run linter
        run: make lint
